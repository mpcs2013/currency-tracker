# _reusable-codeql.yml — CodeQL C# analysis, build-mode none (13.11 lineage).
# The CALLER job must grant `security-events: write` for SARIF upload.
name: _reusable-codeql

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:csharp"