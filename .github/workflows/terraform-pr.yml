# terraform-pr.yml — leaf: IaC PR feedback. Full 14.32 gate (apply:false,
# UAT — see docs/ci-cd/pipelines.md for the UAT-only rationale) + the plan
# upserted as a sticky PR comment.
#
# apply:false is what routes this to the `uat-plan` GitHub Environment rather
# than `uat`, whose deployment-branch policy is main-only and would refuse a PR
# branch outright. Keep it false: flipping it here would both apply from a PR
# head and fail, since `uat-plan`'s credential is not what `uat` trusts.
name: terraform-pr

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform
    uses: ./.github/workflows/_reusable-terraform.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: uat
      apply: false

  plan-comment:
    name: plan-comment
    needs: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5   # without this the job inherits the 360-minute default
    permissions:
      pull-requests: write
    steps:
      - name: Upsert plan comment
        uses: actions/github-script@v8
        env:
          PLAN: ${{ needs.terraform.outputs.plan }}
        with:
          script: |
            const marker = "<!-- terraform-pr-plan -->";
            const body = [
              marker,
              "### Terraform plan (uat)",
              "_Full output: `tfplan-uat-*` artifact on the workflow run. PROD is planned at release time (deploy-prod.yml)._",
              "```",
              process.env.PLAN || "(empty plan output)",
              "```",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }