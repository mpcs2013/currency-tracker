name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-doc changes
        id: filter
        shell: bash
        run: |
            # On push to main / manual dispatch, always run the full pipeline.
            if [ "${{ github.event_name }}" != "pull_request" ]; then
                echo "code=true" >> "$GITHUB_OUTPUT"
                echo "::notice::${{ github.event_name }} event - running full CI."
                exit 0
            fi
            base="${{ github.event.pull_request.base.sha }}"
            changed="$(git diff --name-only "$base" HEAD)"
            echo "Changed files:"
            echo "$changed"
            # code = any changed file that can affect the .NET pipeline
            # (skippable set: **/*.md, docs/**, infra/**).
            if printf '%s\n' "$changed" | grep -vqE '(\.md$|^docs/|^infra/)'; then
                echo "code=true" >> "$GITHUB_OUTPUT"
            else
                echo "code=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Doc-only change - skipping build, tests, and integration jobs."
            fi

  format:
    name: format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_reusable-format.yml

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_reusable-build.yml

  ci:
    name: ci
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_reusable-test.yml
    # coverage-min defaults to "58" inside the reusable (13.14 floor).

  codeql:
    name: codeql
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_reusable-codeql.yml

  aspire-smoke:
    name: aspire-smoke
    needs: [changes, ci]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build smoke tests
        run: dotnet build tests/CurrencyTracker.AppHost.SmokeTests --configuration Release --no-restore

      - name: Run aspire smoke
        run: dotnet test tests/CurrencyTracker.AppHost.SmokeTests --configuration Release --no-build

  infrastructure-integration-tests:
    name: infrastructure-integration-tests
    needs: [changes, ci]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build integration tests
        run: dotnet build tests/CurrencyTracker.Infrastructure.IntegrationTests --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test tests/CurrencyTracker.Infrastructure.IntegrationTests --configuration Release --no-build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history so the diff scan sees every commit in the PR

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # used only to comment on the PR

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml